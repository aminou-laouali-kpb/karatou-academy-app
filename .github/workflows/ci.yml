name: CI

# Runs on every push and pull request to main. Fast checks (typecheck/lint/unit)
# always run; the heavier E2E (Playwright with two Vite dev modes + 27 specs)
# runs as a separate job so a quick failure surfaces in seconds.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a previous in-flight run for the same ref/PR — saves CI minutes on
# rapid pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: typecheck · lint · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Bundle and service-worker precache budgets (2G audience).
      - run: node scripts/validate-release.mjs

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    # Independent of `static` so both jobs run in parallel; CI fails if either
    # does. (`needs:` would serialise them.)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Cache Playwright browsers across runs.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright (browsers + system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
